<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>الحضور والانصراف</title>
</head>
<body>
    <h2>تسجيل الحضور والانصراف</h2>

    <p>الوقت الحالي: <strong>{{ time }}</strong></p>

    {% if message %}
        <p style="color: green;">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <button type="submit" name="action" value="دخول">تسجيل دخول</button>
        <button type="submit" name="action" value="خروج">تسجيل خروج</button>
    </form>

    <br>
    <a href="/logout">تسجيل الخروج من الحساب</a>
</body>
</html>
